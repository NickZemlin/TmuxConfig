# Prefix key: Ctrl+b (restored so normal prefix-table binds work)
set-option -g prefix C-b

# Enable mouse support
set-option -g mouse on

# Start window and pane numbering at 1
set-option -g base-index 1
set-window-option -g pane-base-index 1

# Renumber windows after one is closed
set-option -g renumber-windows on

# Split panes using | and -
bind-key \\ split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Reload config with Prefix + r
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux config reloaded"

# Use vi-style keys in copy mode
set-window-option -g mode-keys vi

# Increase scrollback history
set-option -g history-limit 10000

# --- Truecolor (24-bit RGB) passthrough ---
# Ghostty is a truecolor terminal, but its `xterm-ghostty` terminfo is not
# installed system-wide, so tmux can't auto-detect RGB. The `Tc` flag forces
# tmux to pass 24-bit color (e.g. fastfetch/nvim Tokyo Night hex colors)
# through to the terminal instead of stripping them.
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-ghostty:Tc"

# --- Pane borders (tokyonight-night, active pane highlight) ---
# 1-cell header strip per pane (top) — acts as a "margin row" between panes
# and makes the active pane obvious even in a 2-pane vertical split.
set-option -g pane-border-status top
set-option -g pane-border-format "#{?pane_active,#[fg=#7aa2f7]#[bold],#[fg=#565f89]} #{pane_index} "

# --- Status line (tokyonight-night, mirrors nvim lualine) ---
# Palette (tokyonight night):
#   bg=#1a1b26  bg_dark=#16161e  bg_hi=#292e42  fg=#c0caf5  fg_dark=#a9b1d6
#   blue=#7aa2f7  magenta=#bb9af7  cyan=#7dcfff  green=#9ece6a
#   yellow=#e0af68  orange=#ff9e64  red=#f7768e  comment=#565f89
# Powerline rounded section separators (Nerd Font):  = U+E0B4,  = U+E0B6
set-option -g status on
set-option -g status-position top
set-option -g status-interval 2
set-option -g status-justify right
set-option -g status-style "bg=#1a1b26,fg=#c0caf5"
set-option -g status-left-length 120

# Window list: inactive dim, current highlighted (tokyo night bg_hi)
set-option -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W#($HOME/.config/tmux/agent_status.sh #{window_id})#[fg=#565f89] "
set-option -g window-status-current-format "#[fg=#c0caf5,bg=#292e42,bold] #I:#W#($HOME/.config/tmux/agent_status.sh #{window_id})#[fg=#c0caf5,bold] #{?window_zoomed_flag,#[fg=#e0af68]Z,}"
set-option -g window-status-separator ""
set-option -g window-status-activity-style "fg=#e0af68,bg=#1a1b26"
set-option -g window-status-bell-style "fg=#f7768e,bg=#1a1b26,bold"

# Left:  [PREFIX] [session] [git-branch] [current-path]
#   - prefix:  yellow block, shown only while the prefix (C-b) is active
#   - session: blue block           (lualine_a: mode)
#   - branch:  magenta block        (lualine_b: branch)
#   - path:    bg_dark text block    (lualine_c: filename)
set-option -g status-left "\
#{?client_prefix,#[fg=#16161e#,bg=#e0af68#,bold] PREFIX #[fg=#e0af68#,bg=#7aa2f7]\ue0b4,}\
#[fg=#16161e,bg=#7aa2f7,bold] #S \
#[fg=#7aa2f7,bg=#bb9af7]\
#[fg=#16161e,bg=#bb9af7]  #(git -C '#{pane_current_path}' branch --show-current 2>/dev/null || echo no-repo) \
#($HOME/.config/tmux/caffeinate_status.sh)#[fg=#a9b1d6,bg=#16161e] #{s|$HOME|~|:pane_current_path} \
#[fg=#16161e,bg=#1a1b26]"

# status-right is left empty. tmux-continuum (loaded below via TPM) prepends
# its invisible save-check interpolation to whatever status-right is at load
# time; keeping it empty means only continuum's (invisible) interpolation is
# present.
set-option -g status-right ""


# --- Plugins (TPM) ---
set -g @plugin 'alexwforsythe/tmux-which-key'
# Session persistence: save/restore layout + processes across reboots.
# Manual: prefix + Ctrl-s (save) / prefix + Ctrl-r (restore).
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Auto-save every 15 min and auto-restore on tmux server start.
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Whitelist processes to restart on restore (matches btop + caffeinate -d
# launched by ~/.config/tmux/bootstrap.sh in the Btop+Caffeinate window).
set -g @resurrect-processes 'btop "caffeinate -d"'
# XDG: tell TPM where plugins live (it only auto-detects on first run;
# without this, server reloads keep the stale pre-move TMUX_PLUGIN_MANAGER_PATH).
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run '~/.config/tmux/plugins/tpm/tpm'

# The menu is bound to `prefix + Space` (i.e. C-b then Space) by the plugin's
# own `prefix_table: Space` key in config.yaml — no manual binding here.

